<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Building efficient inference for multimodal AI</title>
  <desc id="desc">Text, image, audio, and video inputs converge into a shared inference engine. A navy background with mint and blue accents.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1726"/>
      <stop offset="1" stop-color="#142a36"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b4c5da" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#background)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <path d="M48 54h32" stroke="#7ee2c5" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="88" fill="#7ee2c5" font-size="12" font-weight="600" letter-spacing="2.4">INFERENCE SYSTEMS / OPEN SOURCE</text>
    <text x="46" y="140" fill="#f2f6fc" font-size="40" font-weight="700">Build. Profile. Optimize.</text>
    <text x="48" y="179" fill="#b6c8d9" font-size="19">Efficient inference for multimodal AI.</text>
    <text x="48" y="233" fill="#b6c8d9" font-size="14">WeiQing Chen</text>
    <circle cx="160" cy="228" r="2" fill="#7ee2c5"/>
    <text x="174" y="233" fill="#b6c8d9" font-size="14">vLLM-Omni Committer</text>
  </g>
  <g fill="none" stroke="#6d92a9" stroke-width="1.5" stroke-linecap="round">
    <path d="M796 64h29q18 0 18 18v116q0 18-18 18h-29"/>
    <path d="M796 114h47m-47 51h47m0-25h44"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    <g fill="#152839" stroke="#355269">
      <rect x="700" y="46" width="96" height="36" rx="8"/>
      <rect x="700" y="96" width="96" height="36" rx="8"/>
      <rect x="700" y="147" width="96" height="36" rx="8"/>
      <rect x="700" y="198" width="96" height="36" rx="8"/>
    </g>
    <g fill="#d7e5f2">
      <text x="748" y="69">TEXT</text>
      <text x="748" y="119">IMAGE</text>
      <text x="748" y="170">AUDIO</text>
      <text x="748" y="221">VIDEO</text>
    </g>
    <rect x="888" y="92" width="252" height="96" rx="12" fill="#16343a" stroke="#7ee2c5" stroke-opacity=".7"/>
    <text x="1014" y="133" fill="#f2f6fc" font-size="21" font-weight="600">INFERENCE</text>
    <text x="1014" y="160" fill="#a8d6cb" font-size="12" letter-spacing="1.2">MEASURE / VERIFY / ITERATE</text>
  </g>
  <circle cx="843" cy="140" r="4" fill="#7ee2c5"/>
</svg>
